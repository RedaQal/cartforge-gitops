imagePullPolicy: IfNotPresent

database:
  image: postgres:16-alpine
  name: catalog
  existingSecret: cartforge-db   # created outside Git, keys: POSTGRES_USER, POSTGRES_PASSWORD
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

catalog:
  replicas: 1
  image:
    repository: registry:5000/catalog-service
    tag: ""            # set per environment: the git SHA of the build
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

frontend:
  replicas: 1
  image:
    repository: registry:5000/frontend
    tag: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: true
  className: nginx
  host: shop.local